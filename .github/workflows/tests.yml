name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m cnlookthrough examples/demo.json --format markdown
      - name: Verify exported single-repository installed demo
        run: python .github/scripts/validate_isolated_install.py
      - name: Prepare release build backend
        run: python -m pip install "setuptools>=68" wheel
      - name: Verify exact-HEAD release candidate assets
        run: python .github/scripts/build_release_candidate.py --out-dir release-check-assets --work-dir release-check-work
