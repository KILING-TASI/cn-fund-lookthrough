[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cn-fund-lookthrough"
version = "0.2.2"
description = "中国基金持仓穿透：显式来源、未知与计算边界"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.optional-dependencies]
pdf = ["pdfplumber>=0.11,<0.12"]
[tool.setuptools.packages.find]
include = ["cnlookthrough*"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

# Installed CLI teaching input; Skill resources are complete in the source ZIP.
[tool.setuptools.data-files]
"share/cn-fund-lookthrough/examples" = ["examples/demo.json", "examples/holdings-import.csv", "examples/holdings-import-config.json", "examples/INPUT_CONTRACTS.md"]

[project.scripts]
cn-fund-lookthrough = "cnlookthrough._entry:main"
